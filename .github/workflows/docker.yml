name: 构建、验证并发布容器镜像

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_NAMESPACE: link2cloud
  ACR_ENABLED: ${{ secrets.ACR_USERNAME != '' && secrets.ACR_PASSWORD != '' }}

jobs:
  build:
    name: 构建 ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: app
            suffix: ""
            dockerfile: config/docker/Dockerfile.web
            target: prod
            cache_scope: buildkit
            build_args: |
              ENV_NAME=prod
              DEBIAN_MIRROR=https://deb.debian.org/debian
              DEBIAN_SECURITY_MIRROR=https://deb.debian.org/debian-security
          - component: postgis
            suffix: -postgis
            dockerfile: config/docker/Dockerfile.db
            target: ""
            cache_scope: postgis
            build_args: ""

    steps:
      - name: 获取代码
        uses: actions/checkout@v6

      - name: 设置镜像名称
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<IMAGE_TAGS'
            echo "$image:sha-$GITHUB_SHA"
            if [[ "$ACR_ENABLED" == 'true' ]]; then
              repository="${GITHUB_REPOSITORY##*/}"
              repository="${repository,,}${{ matrix.suffix }}"
              echo "$ACR_REGISTRY/$ACR_NAMESPACE/$repository:sha-$GITHUB_SHA"
            fi
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: 配置 ARM64 构建支持
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录阿里云 ACR
        if: env.ACR_ENABLED == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送待验证镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build_args }}
          push: true
          # ACR 经典仓库需要使用传统的构建证明清单格式。
          outputs: ${{ env.ACR_ENABLED == 'true' && 'type=image,oci-artifact=false' || '' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

  verify-deploy:
    name: 部署验证 ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: 获取部署脚本
        uses: actions/checkout@v6

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 准备独立的 CI 部署配置
        run: |
          bash -n config/deploy/deploy.sh
          python3 - <<'PY'
          import os
          from pathlib import Path

          image = f"ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}"
          tag = f"sha-{os.environ['GITHUB_SHA']}"
          values = {
              'COMPOSE_PROJECT_NAME': f"deploy-ci-{os.environ['GITHUB_RUN_ID']}",
              'APP_IMAGE': f'{image}:{tag}',
              'POSTGIS_IMAGE': f'{image}-postgis:{tag}',
              'SECRET_KEY': f"ci-only-{os.environ['GITHUB_SHA']}",
              'POSTGRES_PASSWORD': 'ci-postgres-only',
              'REDIS_PASSWORD': 'ci-redis-only',
              'HTTP_BIND': '127.0.0.1',
              'HTTP_PORT': '18080',
              'SITE_DOMAIN': 'localhost:18080',
              'CSRF_TRUSTED_ORIGINS': 'http://localhost:18080',
          }
          template = Path('config/deploy/.env.example').read_text()
          lines = []
          for line in template.splitlines():
              key = line.partition('=')[0]
              lines.append(f'{key}={values[key]}' if key in values else line)
          Path('config/deploy/.env').write_text('\n'.join(lines) + '\n')
          PY

      - name: 直接启动 Compose 验证 Web 自动迁移
        run: |
          compose=(docker compose --env-file config/deploy/.env -f config/deploy/compose.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" pull
          "${compose[@]}" up -d --wait --wait-timeout 600

      - name: 检查 PostGIS、Redis、上传目录和后台服务
        run: |
          compose=(docker compose --env-file config/deploy/.env -f config/deploy/compose.yml)
          for path in /-/health/ /dashboard/ /h5/; do
            curl --fail --silent --show-error "http://localhost:18080$path" -o /dev/null
          done
          "${compose[@]}" exec -T web python - <<'PY'
          from pathlib import Path
          import django
          django.setup()
          from django.conf import settings
          from django.contrib.sites.models import Site
          from django.core.cache import cache
          from django.db import connection

          with connection.cursor() as cursor:
              cursor.execute('SELECT PostGIS_Version()')
              assert cursor.fetchone()[0]
          Site.objects.create(domain='ci-preserved.test', name='CI persistence')
          cache.set('deploy-ci-check', 'ready', timeout=600)
          assert cache.get('deploy-ci-check') == 'ready'
          (Path(settings.MEDIA_ROOT) / 'deploy-ci-check.txt').write_text('ready')
          (Path(settings.DATA_MIGRATION_PRIVATE_ROOT) / 'deploy-ci-check.txt').write_text('ready')
          PY
          "${compose[@]}" exec -T worker celery -A config inspect ping --timeout 10
          "${compose[@]}" exec -T worker python -c "from pathlib import Path; assert Path('/srv/app/.private/data-migration/deploy-ci-check.txt').read_text() == 'ready'"
          "${compose[@]}" exec -T beat python -c "from pathlib import Path; assert list(Path('/var/lib/celery').glob('celerybeat-schedule*')); Path('/var/lib/celery/deploy-ci-check.txt').write_text('ready')"
          test "$(curl --fail --silent --show-error http://localhost:18080/public/media/deploy-ci-check.txt)" = ready

      - name: 再次部署并确认数据保留
        run: |
          bash config/deploy/deploy.sh
          compose=(docker compose --env-file config/deploy/.env -f config/deploy/compose.yml)
          "${compose[@]}" exec -T web python - <<'PY'
          from pathlib import Path
          import django
          django.setup()
          from django.conf import settings
          from django.contrib.sites.models import Site
          from django.core.cache import cache

          assert Site.objects.filter(domain='ci-preserved.test').exists()
          assert cache.get('deploy-ci-check') == 'ready'
          assert (Path(settings.MEDIA_ROOT) / 'deploy-ci-check.txt').read_text() == 'ready'
          assert (Path(settings.DATA_MIGRATION_PRIVATE_ROOT) / 'deploy-ci-check.txt').read_text() == 'ready'
          PY
          "${compose[@]}" exec -T beat python -c "from pathlib import Path; assert Path('/var/lib/celery/deploy-ci-check.txt').read_text() == 'ready'"
          test "$(curl --fail --silent --show-error http://localhost:18080/public/media/deploy-ci-check.txt)" = ready

      - name: 确认六个服务并记录空载资源快照
        run: |
          compose=(docker compose --env-file config/deploy/.env -f config/deploy/compose.yml)
          printf 'CI CPU 核数：%s\n' "$(getconf _NPROCESSORS_ONLN)"
          docker info --format 'Docker 架构：{{.Architecture}}'
          mapfile -t container_ids < <("${compose[@]}" ps --all --quiet)
          test "${#container_ids[@]}" -eq 6
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.PIDs}}' "${container_ids[@]}"
          for service in web worker proxy; do
            docker top "$("${compose[@]}" ps --quiet "$service")" -eo pid,ppid,args
          done

      - name: 输出失败诊断
        if: failure()
        run: |
          docker compose --env-file config/deploy/.env -f config/deploy/compose.yml ps -a
          docker compose --env-file config/deploy/.env -f config/deploy/compose.yml logs --tail 100

  publish:
    name: 发布验证通过的镜像
    needs: verify-deploy
    runs-on: ubuntu-latest
    steps:
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录阿里云 ACR
        if: env.ACR_ENABLED == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 提示 ACR 尚未启用
        if: env.ACR_ENABLED != 'true'
        run: echo '::warning::未完整配置 ACR_USERNAME、ACR_PASSWORD，已跳过 ACR 发布，GHCR 正常发布。'

      - name: 更新服务端部署使用的镜像标签
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$image:sha-$GITHUB_SHA"
          docker buildx imagetools create --tag "$image-postgis:17" "$image-postgis:sha-$GITHUB_SHA"
          if [[ "$ACR_ENABLED" == 'true' ]]; then
            repository="${GITHUB_REPOSITORY##*/}"
            acr_image="$ACR_REGISTRY/$ACR_NAMESPACE/${repository,,}"
            docker buildx imagetools create --tag "$acr_image:latest" "$acr_image:sha-$GITHUB_SHA"
            docker buildx imagetools create --tag "$acr_image-postgis:17" "$acr_image-postgis:sha-$GITHUB_SHA"
          fi
