name: ${COMPOSE_PROJECT_NAME:-linkcloud-space-prod}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/ol0o0lo/linkcloud-space:latest}
  init: true
  restart: unless-stopped
  stop_grace_period: 120s
  logging: *logging
  env_file:
    - ${DEPLOY_ENV_FILE:-.env}
  environment:
    DEBUG: "off"
    READ_DOT_ENV_FILE: "false"
    SECRET_KEY: ${SECRET_KEY:?请设置 SECRET_KEY}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?请设置 ALLOWED_HOSTS}
    SITE_SCHEME: ${SITE_SCHEME:-http}
    SECURE_PROXY_SSL_HEADER: "true"
    DB_SSL_REQUIRED: "false"
    DATABASE_URL: postgresql://${POSTGRES_USER:-linkcloud}:${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-linkcloud}
    REDIS_URL: redis://:${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}@redis:6379/0
  volumes:
    - media_data:/srv/app/public/media
    - migration_data:/srv/app/.private/data-migration
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: ${POSTGIS_IMAGE:-ghcr.io/ol0o0lo/linkcloud-space-postgis:17}
    restart: unless-stopped
    logging: *logging
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-32}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkcloud}
      POSTGRES_DB: ${POSTGRES_DB:-linkcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 20

  web:
    <<: *app
    command:
      - sh
      - -ec
      - |
        python manage.py migrate --noinput
        python manage.py ensure_s3_bucket
        exec gunicorn --config=gunicorn.conf.py \
          --workers=${WEB_CONCURRENCY:-1} \
          --threads=${GUNICORN_THREADS:-8} \
          config.wsgi:application
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/-/health/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 120s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--pool=prefork", "--concurrency=${CELERY_WORKER_CONCURRENCY:-1}", "--prefetch-multiplier=1"]
    depends_on:
      web:
        condition: service_healthy

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/var/lib/celery/celerybeat-schedule"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - media_data:/srv/app/public/media
      - migration_data:/srv/app/.private/data-migration
      - beat_data:/var/lib/celery

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_SCHEME: ${SITE_SCHEME:-http}
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-1}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - media_data:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/-/health/"]
      interval: 30s
      timeout: 10s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  media_data:
  migration_data:
  beat_data:
